# Accessibility Checklist
accessibility:
  - "✓ Color contrast ratio ≥ 4.5:1 for normal text"
  - "✓ Clear focus indicator visible at all times"
  - "✓ Keyboard accessible (Tab, Enter, Space)"
  - "✓ Proper ARIA labels for screen readers"
  - "✓ Loading state announced to assistive technology"
  - "✓ Disabled state properly communicated"

# Common Pitfalls to Avoid
pitfalls:
  - "Using divs instead of semantic button elements"
  - "Insufficient color contrast on hover/focus states"
  - "Missing focus outline or making it invisible"
  - "Not supporting keyboard navigation"
  - "Missing ARIA labels for icon-only buttons"
  - "Not announcing loading state to screen readers"
  - "Too small click/touch target area (< 44px)"

# Tips for Best Results
tips:
  - "Always use native HTML button element as base"
  - "Test with keyboard navigation and screen readers"
  - "Ensure minimum 44x44px touch target area"
  - "Provide clear visual feedback for all states"
  - "Use aria-busy for loading states"
  - "Include loading spinner for async operations"
  - "Test color contrast with WCAG checker tools"
  - "Keep button text concise and action-oriented"
