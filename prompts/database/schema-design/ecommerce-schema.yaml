# Database Design Principles
principles:
  - "Normalize to 3NF to eliminate redundancy"
  - "Use surrogate keys (auto-increment IDs)"
  - "Foreign keys enforce referential integrity"
  - "Constraints validate data quality"
  - "Indexes optimize query performance"

# Common Pitfalls to Avoid
pitfalls:
  - "Over-normalization causing excessive joins"
  - "Missing indexes on frequently queried columns"
  - "No constraints allowing invalid data"
  - "Not using proper data types"
  - "Ignoring NULL handling implications"
  - "Missing foreign key constraints"
  - "No created_at/updated_at timestamps"
  - "Denormalization without clear performance needs"

# Tips for Best Results
tips:
  - "Always include timestamps (created_at, updated_at)"
  - "Use appropriate data types to save space"
  - "Add CHECK constraints for data validation"
  - "Create indexes on foreign keys and frequently filtered columns"
  - "Use UNIQUE constraints for business keys"
  - "Implement CASCADE/RESTRICT rules appropriately"
  - "Test queries with EXPLAIN ANALYZE"
  - "Plan for growth and scalability from the start"
