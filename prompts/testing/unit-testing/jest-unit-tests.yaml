# Testing Recommendations
testing:
  unit:
    - "Test each function in isolation"
    - "Mock external dependencies"
    - "Test both success and failure paths"
  coverage:
    - "Aim for >80% line coverage"
    - "Ensure branch coverage for conditionals"
    - "Test error scenarios"

# Common Pitfalls to Avoid
pitfalls:
  - "Testing implementation details instead of behavior"
  - "Not cleaning up after tests (clearAllMocks)"
  - "Flaky tests that fail intermittently"
  - "Not testing error cases"
  - "Over-mocking making tests brittle"
  - "Ignoring async/await properly"
  - "Not grouping related tests with describe blocks"

# Tips for Best Results
tips:
  - "Use descriptive test names that explain what is being tested"
  - "Follow AAA pattern: Arrange, Act, Assert"
  - "Use beforeEach and afterEach for setup and cleanup"
  - "Test behavior, not implementation"
  - "Keep tests focused and isolated"
  - "Use fixtures for complex test data"
  - "Mock external dependencies consistently"
  - "Aim for high coverage but focus on important paths first"
